<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1><i class="icon">▶</i> YouTube Video Downloader</h1>
                <p class="subtitle">Download your favorite YouTube videos directly to your device</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Download Section -->
            <section class="download-section">
                <div class="download-card">
                    <h2>Enter YouTube URL</h2>
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="urlInput" 
                            class="url-input" 
                            placeholder="Paste YouTube URL here (e.g., https://www.youtube.com/watch?v=...)"
                            autocomplete="off"
                        >
                        <button id="downloadBtn" class="download-btn">Download</button>
                    </div>
                    <div id="statusMessage" class="status-message"></div>
                    <div id="progressBar" class="progress-bar hidden">
                        <div id="progressFill" class="progress-fill"></div>
                        <p class="progress-text">Downloading...</p>
                    </div>
                </div>
            </section>

            <!-- Downloaded Videos Section -->
            <section class="videos-section">
                <h2>Downloaded Videos</h2>
                <div id="videosList" class="videos-grid">
                    <div class="loading-message">Loading videos...</div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2024 YouTube Video Downloader. All rights reserved.</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
